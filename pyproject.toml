[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-atp"
version = "0.1.0"
description = "Accountable-autonomy scaffold for Data-ATP"
requires-python = ">=3.11"
authors = [{name = "Brian Tenneson"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
