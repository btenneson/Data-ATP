name: DATA-MIND 2.10 — Federated BANK CI

on:
  push:
    branches: [main, data-mind-2.10-federated-bank]
    paths:
      - 'src/data_atp/**'
      - 'tests/**'
      - 'docs/architecture/ADR-0003-data-mind-2.10-federated-bank.md'
      - '.github/workflows/data-mind-2-10-federated-bank-ci.yml'
  pull_request:
    paths:
      - 'src/data_atp/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  federation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Verify architecture marker
        run: python -c "import data_atp; assert data_atp.DATA_MIND_ARCHITECTURE_VERSION == '2.10'"
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
