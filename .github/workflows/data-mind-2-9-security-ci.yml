name: DATA-MIND 2.9 — Security enforcement CI

on:
  push:
    branches: [main]
    paths:
      - 'src/data_atp/**'
      - 'tests/**'
      - '.github/workflows/data-mind-2-9-security-ci.yml'
  pull_request:
    paths:
      - 'src/data_atp/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
