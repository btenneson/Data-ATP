name: DATA-MIND Ocean runtime calibration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/data-mind-ocean-runtime-calibration.yml'
      - 'experiments/data_mind_ocean_calibrate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: L=${{ matrix.depth }} calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        depth: [100000, 250000, 500000, 750000, 1000000, 1500000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover frozen R01 generator
        shell: bash
        run: |
          set -euo pipefail
          R01=953b0503b164cfc32ad939bef642d30781e6575e
          git fetch --no-tags --depth=1 origin "$R01"
          mkdir -p "$RUNNER_TEMP/r01"
          git show "$R01:benchmarks/notald_ocean_r01/scripts/generate_tied_ocean_v1.py" > "$RUNNER_TEMP/r01/generate.py"
          echo "$R01" > "$RUNNER_TEMP/r01/commit.txt"

      - name: Generate calibration instance
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/r01/generate.py" \
            --out "$RUNNER_TEMP/ocean" \
            --depths '${{ matrix.depth }}' \
            --seeds 1729
          test "$(find "$RUNNER_TEMP/ocean/solver_inputs/standard" -name '*.p' | wc -l)" -eq 1

      - name: Run generic DATA-MIND search core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          P=$(find "$RUNNER_TEMP/ocean/solver_inputs/standard" -name '*.p' | head -1)
          /usr/bin/time -v timeout 180s python experiments/data_mind_ocean_calibrate.py \
            --problem "$P" \
            --reference benchmarks/ocean_reference/reference_solvers.py \
            --max-expansions 100000000 \
            --out "results/L${{ matrix.depth }}.json" \
            2> "results/L${{ matrix.depth }}.time.txt"
          cat "results/L${{ matrix.depth }}.json"
          cat "results/L${{ matrix.depth }}.time.txt"

      - name: Upload calibration result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-mind-ocean-calibration-L${{ matrix.depth }}
          path: results/
          if-no-files-found: warn
