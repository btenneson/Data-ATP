name: DATA-MIND 2.10 — Supervised proof-horizon training on frozen 95%

on:
  pull_request:
    paths:
      - 'experiments/data_mind_2_10_train_proof_horizon95_supervised.py'
      - '.github/workflows/data-mind-2-10-proof-horizon95-supervised.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/data_mind_2_10_train_proof_horizon95_supervised.py'
      - '.github/workflows/data-mind-2-10-proof-horizon95-supervised.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ATP_COMMIT: ad2300ab1a47119f93f3417bc52c348f87e57c62
  LEGACY_TRAINER_COMMIT: 3594f3ceae7768391d65709df1ceb53c737ffd4e
  SETMM_COMMIT: cd577894d8e6bf8b4fe8014c0d525d531507e4b7
  SETMM_SHA256: 1016d7edb0508abde0fe240bb5243e588c5067f8cb10ee6e1cc5733fc05acdb5
  TARGET: sgrpcl
  FRACTION: '0.95'
  SEED: '2301'
  OLD_TRAINING_RUN_ID: '33415636479'
  OLD_TRAINING_ARTIFACT: data-mind-2.6-setmm95-pretraining-33415636479
  OLD_RANKER_FILE_SHA256: 45e4eb417186257799a2e985ecd7f16c43b49c067f55f0ff7e19f5681c09472c
  PARSE_TIMEOUT_S: '5'
  SENTINEL_MAX_RAM_FRACTION: '0.40'

jobs:
  supervisor-preflight:
    name: supervisor-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: btenneson/ATP
          ref: ${{ env.ATP_COMMIT }}
          path: upstream_atp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3
          python -m pip install -e .

      - name: Retrieve exact historical trainer source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 --fail \
            -o experiments/data_mind_2_8_train_proof_horizon95.py \
            "https://raw.githubusercontent.com/btenneson/Data-ATP/$LEGACY_TRAINER_COMMIT/experiments/data_mind_2_8_train_proof_horizon95.py"
          curl -L --retry 3 --fail \
            -o experiments/data_mind_2_6_setmm95_pretrain.py \
            "https://raw.githubusercontent.com/btenneson/Data-ATP/$LEGACY_TRAINER_COMMIT/experiments/data_mind_2_6_setmm95_pretrain.py"
          python -m py_compile \
            experiments/data_mind_2_10_train_proof_horizon95_supervised.py \
            experiments/data_mind_2_8_train_proof_horizon95.py \
            experiments/data_mind_2_6_setmm95_pretrain.py \
            upstream_atp/setmm_grammar.py \
            'upstream_atp/predator 8/predator_fast_parse.py'

      - name: Verify 2.10 architecture and external kill boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/dm210-supervisor-selftest
          PYTHONPATH="$GITHUB_WORKSPACE/upstream_atp:$GITHUB_WORKSPACE/upstream_atp/predator 8:$GITHUB_WORKSPACE/experiments:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" \
            python -u experiments/data_mind_2_10_train_proof_horizon95_supervised.py \
              --supervision-selftest \
              --parse-timeout-s 0.05 \
              --sentinel-max-ram-fraction 0.40 \
              --out results/dm210-supervisor-selftest
          python - <<'PY'
          import json
          from pathlib import Path
          import data_atp
          assert data_atp.DATA_MIND_ARCHITECTURE_VERSION == '2.10'
          s=json.loads(Path('results/dm210-supervisor-selftest/supervision_summary.json').read_text())
          assert s['quarantined_runtime'] >= 1
          assert s['completed'] >= 1
          print(json.dumps(s, indent=2))
          PY

      - name: Run existing unit suite
        run: python -m unittest discover -s tests -v

  train-frozen95:
    name: train-frozen95-supervised
    if: github.event_name != 'pull_request'
    needs: supervisor-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: btenneson/ATP
          ref: ${{ env.ATP_COMMIT }}
          path: upstream_atp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned learner and DATA-MIND 2.10
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3
          python -m pip install -e .

      - name: Retrieve exact frozen 95% cohort checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.OLD_TRAINING_ARTIFACT }}
          path: checkpoint26
          github-token: ${{ github.token }}
          repository: btenneson/Data-ATP
          run-id: ${{ env.OLD_TRAINING_RUN_ID }}

      - name: Reconstruct exact historical learner and pinned set.mm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/dm210-proof-horizon95-supervised
          curl -L --retry 3 --fail \
            -o experiments/data_mind_2_8_train_proof_horizon95.py \
            "https://raw.githubusercontent.com/btenneson/Data-ATP/$LEGACY_TRAINER_COMMIT/experiments/data_mind_2_8_train_proof_horizon95.py"
          curl -L --retry 3 --fail \
            -o experiments/data_mind_2_6_setmm95_pretrain.py \
            "https://raw.githubusercontent.com/btenneson/Data-ATP/$LEGACY_TRAINER_COMMIT/experiments/data_mind_2_6_setmm95_pretrain.py"
          curl -L --retry 3 --fail -o 'upstream_atp/predator 8/set.mm' \
            "https://raw.githubusercontent.com/metamath/set.mm/$SETMM_COMMIT/set.mm"
          test "$(sha256sum 'upstream_atp/predator 8/set.mm' | awk '{print $1}')" = "$SETMM_SHA256"
          test "$(sha256sum checkpoint26/ranker95.json | awk '{print $1}')" = "$OLD_RANKER_FILE_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          import data_atp
          assert data_atp.DATA_MIND_ARCHITECTURE_VERSION == '2.10'
          q=json.loads(Path('checkpoint26/ranker95.json').read_text())
          assert q['architecture_version']=='2.6'
          assert q['target']=='sgrpcl'
          assert q['learner_target_statement_exposed'] is False
          assert q['learner_target_proof_exposed'] is False
          assert abs(float(q['training_fraction_of_target_clean_corpus'])-.95)<1e-12
          print('DATA-MIND 2.10 host and frozen 2.6 cohort checkpoint verified.')
          PY
          python -m py_compile \
            experiments/data_mind_2_10_train_proof_horizon95_supervised.py \
            experiments/data_mind_2_8_train_proof_horizon95.py \
            experiments/data_mind_2_6_setmm95_pretrain.py \
            upstream_atp/ml_sic_atp.py upstream_atp/metamath.py upstream_atp/setmm_grammar.py \
            'upstream_atp/predator 8/predator_fast_parse.py'

      - name: Train exact frozen learner under DATA-MIND 2.10 Sentinel supervision
        shell: bash
        run: |
          set -euo pipefail
          OUT='results/dm210-proof-horizon95-supervised'
          /usr/bin/time -f 'process_wall_s=%e\nmax_rss_kb=%M' -o "$OUT/process_time.txt" \
            timeout 8700 env \
              PYTHONPATH="$GITHUB_WORKSPACE/upstream_atp:$GITHUB_WORKSPACE/upstream_atp/predator 8:$GITHUB_WORKSPACE/experiments:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" \
              python -u experiments/data_mind_2_10_train_proof_horizon95_supervised.py \
                --parse-timeout-s "$PARSE_TIMEOUT_S" \
                --sentinel-max-ram-fraction "$SENTINEL_MAX_RAM_FRACTION" \
                --db "$GITHUB_WORKSPACE/upstream_atp/predator 8/set.mm" \
                --ml-sic "$GITHUB_WORKSPACE/upstream_atp/ml_sic_atp.py" \
                --sanitizer "$GITHUB_WORKSPACE/experiments/data_mind_2_6_setmm95_pretrain.py" \
                --atp-root "$GITHUB_WORKSPACE/upstream_atp" \
                --old-ranker "$GITHUB_WORKSPACE/checkpoint26/ranker95.json" \
                --target "$TARGET" \
                --fraction "$FRACTION" \
                --seed "$SEED" \
                --out "$OUT"

      - name: Verify training completion, cohort invariants, and containment
        shell: bash
        run: |
          set -euo pipefail
          OUT='results/dm210-proof-horizon95-supervised'
          test -s "$OUT/TRAINING_COMPLETE"
          test -s "$OUT/proof_horizon95.json"
          test -s "$OUT/result.json"
          test -s "$OUT/data_mind_2_10_training_manifest.json"
          test -s "$OUT/supervision_summary.json"
          test -s "$OUT/sentinel_quarantine.jsonl"
          python - "$OUT" <<'PY'
          import json,sys
          from pathlib import Path
          out=Path(sys.argv[1])
          r=json.loads((out/'result.json').read_text())
          m=json.loads((out/'data_mind_2_10_training_manifest.json').read_text())
          s=json.loads((out/'supervision_summary.json').read_text())
          q=[json.loads(x) for x in (out/'sentinel_quarantine.jsonl').read_text().splitlines() if x.strip()]
          assert r['status']=='TRAINING_COMPLETE'
          # The learned component remains the exact 2.8 learner; 2.10 is the host architecture.
          assert r['architecture_version']=='2.8'
          assert r['same_95pct_cohort_as_ranker26'] is True
          assert r['learner_target_statement_exposed'] is False
          assert r['learner_target_proof_exposed'] is False
          assert r['studied_theorems']==45159
          assert r['holdout_theorems']==2377
          assert r['validation']['theorems_scored'] > 0
          assert m['host_architecture_version']=='2.10'
          assert m['base_learner_changed'] is False
          assert m['frozen_95pct_cohort_changed'] is False
          assert m['learning_objective_changed'] is False
          assert m['validity_guard_changed'] is False
          assert s['quarantined_runtime'] >= 1
          # quartfull had >11k parser tokens in the isolated diagnostic.
          assert any(x['reason']=='runtime' and x['token_count'] >= 11000 for x in q)
          print(json.dumps({'result':r,'manifest':m,'supervision':s,'quarantines':q},indent=2))
          PY

      - name: Upload DATA-MIND 2.10 supervised proof-horizon education
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-mind-2.10-proof-horizon95-supervised-${{ github.run_id }}
          path: results/dm210-proof-horizon95-supervised/
          if-no-files-found: error
          retention-days: 90
