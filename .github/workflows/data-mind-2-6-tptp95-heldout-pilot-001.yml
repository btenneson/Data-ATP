name: DATA-MIND 2.6 — TPTP 95% Held-Out Pilot 001

on:
  push:
    branches: [data-mind-2.6-quotient-hunter]
    paths:
      - '.github/workflows/data-mind-2-6-tptp95-heldout-pilot-001.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TPTP_VERSION: '9.3.1'
  DOMAIN: GRP
  TARGET: GRP012+5.p
  EDUCATION_FRACTION: '0.95'
  SEED: '314159'
  TRAIN_SECONDS: '1'
  TARGET_SECONDS: '1800'
  PILOT_REF: experiment/dm26-tptp-95-heldout-001

jobs:
  educate:
    name: dm26-tptp95-education
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: btenneson/Data-ATP
          ref: ${{ env.PILOT_REF }}
          path: pilot_code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq eprover
          python -m pip install --disable-pip-version-check -q numpy
          eprover --version | head -20

      - name: Download verified official frozen TPTP release
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="TPTP-v${TPTP_VERSION}.tgz"
          URL="https://tptp.org/TPTP/Distribution/${ARCHIVE}"
          echo "Downloading verified official archive URL: $URL"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
            --output "$ARCHIVE" "$URL"
          test -s "$ARCHIVE"
          echo "archive_bytes=$(stat -c%s "$ARCHIVE")"
          tar -tzf "$ARCHIVE" | grep -q "TPTP-v${TPTP_VERSION}/Problems/${DOMAIN}/"

      - name: Acquire frozen TPTP GRP FOF corpus from archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="TPTP-v${TPTP_VERSION}.tgz"
          SRC="TPTP-v${TPTP_VERSION}"
          mkdir -p extracted tptp/Problems/$DOMAIN tptp/Axioms
          tar -xzf "$ARCHIVE" -C extracted \
            "$SRC/Problems/$DOMAIN" \
            "$SRC/Axioms"
          python - <<'PY'
          import re, shutil
          from pathlib import Path

          version = '9.3.1'
          domain = 'GRP'
          target = 'GRP012+5.p'
          src = Path('extracted') / f'TPTP-v{version}'
          src_probs = src / 'Problems' / domain
          src_axioms = src / 'Axioms'
          root = Path('tptp')
          pdir = root / 'Problems' / domain
          adir = root / 'Axioms'

          pat = re.compile(rf'^{domain}\d{{3}}\+\d+(?:\.\d+)?\.p$')
          names = sorted(p.name for p in src_probs.iterdir() if p.is_file() and pat.match(p.name))
          if target not in names:
              raise SystemExit(f'target absent from frozen archive; FOF-looking files={len(names)}')

          queue=[]
          include_re = re.compile(r"include\(\s*['\"]Axioms/([^'\"]+)")
          for name in names:
              source = src_probs / name
              text = source.read_text(encoding='utf-8', errors='replace')
              shutil.copy2(source, pdir / name)
              queue.extend(include_re.findall(text))

          seen=set()
          while queue:
              ax=queue.pop()
              if ax in seen:
                  continue
              seen.add(ax)
              source = src_axioms / ax
              if not source.is_file():
                  raise RuntimeError(f'missing included axiom in frozen archive: {ax}')
              text = source.read_text(encoding='utf-8', errors='replace')
              shutil.copy2(source, adir / ax)
              queue.extend(include_re.findall(text))

          (root/'SOURCE.txt').write_text(
              f'TPTP frozen release: {version}\n'
              f'domain={domain}\n'
              f'downloaded_archive_first=true\n'
              f'copied_FOF_named_files={len(names)}\n'
              f'copied_recursive_axiom_files={len(seen)}\n',
              encoding='utf-8')
          print((root/'SOURCE.txt').read_text())
          PY
          test -s "tptp/Problems/$DOMAIN/$TARGET"
          grep -q 'TPTP v9.3.1' "tptp/Problems/$DOMAIN/$TARGET"
          find tptp -type f -print0 | sort -z | xargs -0 sha256sum > tptp/SHA256SUMS
          rm -rf extracted "TPTP-v${TPTP_VERSION}.tgz"

      - name: Learn random 95 percent with forced held-out target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/education
          python -u pilot_code/experiments/data_mind_2_6_tptp95_pilot.py train \
            --tptp-root "$GITHUB_WORKSPACE/tptp" --domain "$DOMAIN" --target "$TARGET" \
            --tptp-version "$TPTP_VERSION" --fraction "$EDUCATION_FRACTION" \
            --seed "$SEED" --train-seconds "$TRAIN_SECONDS" --out results/education \
            2>&1 | tee results/education/training.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/education/result.json').read_text())
          m=json.loads(Path('results/education/split_manifest.json').read_text())
          assert r['status']=='TRAINING_COMPLETE' and r['leakage_audit_passed'] is True
          assert r['architecture_version']=='2.6' and r['architecture_changed'] is False
          assert m['target_in_training'] is False
          assert m['same_abstract_problem_variants_in_training'] is False
          assert 'GRP012+5.p' in m['holdout_files']
          assert not any(x.startswith('GRP012') for x in m['training_files'])
          print('95% TPTP education leakage audit: VERIFIED')
          print('training_count=',m['training_count'],'holdout_count=',m['holdout_count'])
          print('actual_fraction=',m['actual_training_fraction'])
          PY

      - name: Upload frozen education and corpus
        uses: actions/upload-artifact@v4
        with:
          name: dm26-tptp95-education-${{ github.run_id }}
          path: |
            results/education/
            tptp/
          if-no-files-found: error
          retention-days: 90

  examine:
    needs: educate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: dm26-tptp-uneducated
            educated: false
          - id: dm26-tptp-educated95
            educated: true
    name: ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: btenneson/Data-ATP
          ref: ${{ env.PILOT_REF }}
          path: pilot_code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq eprover
          python -m pip install --disable-pip-version-check -q numpy

      - name: Retrieve frozen TPTP education
        uses: actions/download-artifact@v4
        with:
          name: dm26-tptp95-education-${{ github.run_id }}
          path: frozen

      - name: Verify frozen protocol
        shell: bash
        run: |
          set -euo pipefail
          cd frozen
          sha256sum -c tptp/SHA256SUMS
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('results/education/split_manifest.json').read_text())
          assert m['target']=='GRP012+5.p' and m['seed']==314159
          assert m['target_in_training'] is False
          assert m['same_abstract_problem_variants_in_training'] is False
          assert not any(x.startswith('GRP012') for x in m['training_files'])
          print('frozen split verified')
          PY

      - name: Run held-out target examination
        shell: bash
        run: |
          set -euo pipefail
          OUT="results/${{ matrix.id }}"; mkdir -p "$OUT"
          EXTRA=()
          if [ '${{ matrix.educated }}' = 'true' ]; then
            EXTRA=(--educated --policy "$GITHUB_WORKSPACE/frozen/results/education/tptp95_policy.json")
          fi
          python -u pilot_code/experiments/data_mind_2_6_tptp95_pilot.py examine \
            --tptp-root "$GITHUB_WORKSPACE/frozen/tptp" --domain "$DOMAIN" --target "$TARGET" \
            --total-seconds "$TARGET_SECONDS" --out "$OUT" "${EXTRA[@]}" \
            2>&1 | tee "$OUT/examination.log"

      - name: Upload held-out evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm26-tptp95-${{ matrix.id }}-${{ github.run_id }}
          path: results/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 90
