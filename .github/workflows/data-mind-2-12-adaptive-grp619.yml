name: DATA-MIND 2.12 — adaptive memory trading GRP619

on:
  push:
    branches: [experiment/dm212-adaptive-memory-trading]
    paths:
      - '.github/workflows/data-mind-2-12-adaptive-grp619.yml'
      - 'experiments/data_mind_2_12_adaptive_grp619.py'
      - 'experiments/data_mind_2_11_durable_grp619.py'
      - 'experiments/data_mind_2_11_tptp95_grp619.py'
      - 'experiments/data_mind_2_10_tptp95_grp619.py'
      - 'src/data_atp/**'
      - 'tests/test_dm212_adaptive.py'
      - 'tests/test_breadcrumbs.py'
  workflow_dispatch:
    inputs:
      target_seconds:
        description: 'Total held-out examination budget in seconds'
        required: false
        default: '1800'
        type: string
      smoke_seconds:
        description: 'Per-candidate adapter smoke budget'
        required: false
        default: '3'
        type: string
      heartbeat_seconds:
        description: 'Memory-slope sampling / breadcrumb interval'
        required: false
        default: '5'
        type: string
      checkpoint_seconds:
        description: 'Pause/checkpoint barrier interval'
        required: false
        default: '20'
        type: string
      resume_state_branch:
        description: 'Optional run-state/dm212-<run_id> branch to resume'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

env:
  TPTP_VERSION: '9.3.1'
  TARGET: 'GRP619+1.p'
  TARGET_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_seconds || '1800' }}
  SMOKE_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_seconds || '3' }}
  HEARTBEAT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.heartbeat_seconds || '5' }}
  CHECKPOINT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint_seconds || '20' }}
  DM211_REMOTE_CHECKPOINT_SECONDS: '60'
  DM211_STATE_BRANCH: run-state/dm212-${{ github.run_id }}
  RESUME_STATE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_state_branch || '' }}
  DM211_SENTINEL_MAX_RSS_FRACTION: '0.65'
  DM211_SENTINEL_MIN_AVAILABLE_FRACTION: '0.20'
  DM212_EARLY_MIN_RSS_GIB: '3.0'
  DM212_EARLY_MIN_SLOPE_MIB_S: '24.0'
  DM212_EARLY_FORECAST_SECONDS: '90'
  DM212_SLOPE_WINDOW_SECONDS: '30'
  FROZEN_SNAPSHOT_COMMIT: '946ed4816dd0928f800165bef189df02f1560018'

jobs:
  dm212-adaptive-grp619:
    name: dm212-grp619-adaptive-memory-trading
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E 3.5.1 and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq eprover
          E_DEB=eprover_3.5.1+ds-1_amd64.deb
          E_URL="https://security.ubuntu.com/ubuntu/pool/universe/e/eprover/$E_DEB"
          curl -fL --retry 5 --retry-delay 3 --output "$E_DEB" "$E_URL"
          test -s "$E_DEB"
          sudo dpkg -i "$E_DEB"
          python -m pip install --disable-pip-version-check -q numpy
          python -m pip install --disable-pip-version-check -e .
          eprover --version | tee eprover-version.txt
          grep -q '3.5.1' eprover-version.txt

      - name: Verify 2.12 controller and inherited durability
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_dm212_adaptive \
            tests.test_breadcrumbs \
            tests.test_checkpoint \
            tests.test_event_log_persistence -v
          python -m py_compile \
            experiments/data_mind_2_12_adaptive_grp619.py \
            experiments/data_mind_2_11_durable_grp619.py \
            experiments/data_mind_2_11_tptp95_grp619.py

      - name: Restore and audit frozen 171/9 education policy
        shell: bash
        run: |
          set -euo pipefail
          SNAP=training_snapshots/dm27_tptp95_proof_density_6h_001/metadata
          mkdir -p frozen_policy
          git show "$FROZEN_SNAPSHOT_COMMIT:$SNAP/tptp95_policy.json" > frozen_policy/tptp95_policy.json
          git show "$FROZEN_SNAPSHOT_COMMIT:$SNAP/split_manifest.json" > frozen_policy/split_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('frozen_policy/tptp95_policy.json').read_text())
          m=json.loads(Path('frozen_policy/split_manifest.json').read_text())
          assert p['target']==m['target']=='GRP619+1.p'
          assert m['training_count']==171 and m['holdout_count']==9
          assert m['target_in_training'] is False
          assert m['same_abstract_problem_variants_in_training'] is False
          assert not any(x.startswith('GRP619') for x in m['training_files'])
          print('FROZEN_SPLIT_AUDIT=VERIFIED')
          PY

      - name: Download official TPTP release
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="TPTP-v${TPTP_VERSION}.tgz"
          URL="https://tptp.org/TPTP/Distribution/${ARCHIVE}"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 --output "$ARCHIVE" "$URL"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" "TPTP-v${TPTP_VERSION}/Problems/GRP" "TPTP-v${TPTP_VERSION}/Axioms"
          ROOT="$GITHUB_WORKSPACE/TPTP-v${TPTP_VERSION}"
          test -f "$ROOT/Problems/GRP/$TARGET"
          echo "TPTP_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: 2.12 portfolio smoke and option quarantine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/smoke
          python -u experiments/data_mind_2_12_adaptive_grp619.py smoke \
            --tptp-root "$TPTP_ROOT" \
            --policy frozen_policy/tptp95_policy.json \
            --manifest frozen_policy/split_manifest.json \
            --seconds "$SMOKE_SECONDS" \
            --heartbeat-seconds 1 \
            --checkpoint-seconds 2 \
            --run-id "dm212-smoke-${GITHUB_RUN_ID}" \
            --out results/smoke \
            2>&1 | tee results/smoke/smoke.log

      - name: Restore prior durable examination state when requested
        if: ${{ env.RESUME_STATE_BRANCH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RESUME_STATE_BRANCH" =~ ^run-state/dm212-([0-9]+)$ ]]; then
            echo "Invalid resume state branch: $RESUME_STATE_BRANCH" >&2
            exit 2
          fi
          OLD_GITHUB_RUN_ID="${BASH_REMATCH[1]}"
          git fetch origin "refs/heads/$RESUME_STATE_BRANCH:refs/remotes/origin/$RESUME_STATE_BRANCH"
          git checkout "origin/$RESUME_STATE_BRANCH" -- results/examination/breadcrumbs
          echo "DM212_EXAMINE_RUN_ID=dm212-examine-${OLD_GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "DM212_RESUME_FLAG=--resume" >> "$GITHUB_ENV"

      - name: Initialize fresh examination identity
        if: ${{ env.RESUME_STATE_BRANCH == '' }}
        shell: bash
        run: |
          echo "DM212_EXAMINE_RUN_ID=dm212-examine-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "DM212_RESUME_FLAG=" >> "$GITHUB_ENV"

      - name: 2.12 adaptive 30-minute held-out examination
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/examination
          python -u experiments/data_mind_2_12_adaptive_grp619.py examine \
            --tptp-root "$TPTP_ROOT" \
            --policy frozen_policy/tptp95_policy.json \
            --manifest frozen_policy/split_manifest.json \
            --smoke-result results/smoke/smoke_result.json \
            --total-seconds "$TARGET_SECONDS" \
            --heartbeat-seconds "$HEARTBEAT_SECONDS" \
            --checkpoint-seconds "$CHECKPOINT_SECONDS" \
            --run-id "$DM212_EXAMINE_RUN_ID" \
            $DM212_RESUME_FLAG \
            --out results/examination \
            2>&1 | tee results/examination/examination.log

      - name: Publish 2.12 comparison summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          print('# DATA-MIND 2.12 adaptive GRP619')
          print(f"\n- Target: `{os.environ.get('TARGET')}`")
          print(f"- Frozen education: `171 train / 9 holdout`; no retraining")
          print(f"- Examination budget: `{os.environ.get('TARGET_SECONDS')} s`")
          print(f"- Durable state branch: `{os.environ.get('DM211_STATE_BRANCH')}`")
          p=Path('results/examination/result.json')
          if not p.exists():
              print('\nNo final result JSON; inspect durable state branch.')
          else:
              r=json.loads(p.read_text())
              print(f"\n- Status: **{r.get('status')}**")
              print(f"- Verifier gate: `{r.get('verifier_gate_passed')}`")
              print(f"- Breadcrumb chain: `{r.get('breadcrumb_chain_verified')}`")
              print(f"- Adaptive strategy trades: `{r.get('adaptive_strategy_trade_count')}`")
              print(f"- Failure trajectories BANKed: `{r.get('failure_trajectory_count')}`")
              print(f"- Attempts executed: `{len(r.get('runs', []))}`")
              for i, run in enumerate(r.get('runs', []), 1):
                  t=run.get('adaptive_telemetry') or {}
                  eff=run.get('search_efficiency') or {}
                  print(
                      f"- {i}. `{run.get('problem_form')}:{run.get('strategy')}` "
                      f"class=`{run.get('outcome_class')}` decision=`{run.get('sentinel_decision')}` "
                      f"elapsed=`{run.get('elapsed_seconds')}` peakMiB=`{eff.get('peak_rss_mib')}` "
                      f"proc/MiB=`{eff.get('processed_clauses_per_peak_mib')}`"
                  )
          PY

      - name: Upload complete 2.12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm212-adaptive-grp619-${{ github.run_id }}
          path: |
            results/
            frozen_policy/
            eprover-version.txt
          if-no-files-found: warn
          retention-days: 90
