name: DATA-MIND 2.11 — breadcrumbed GRP619 recovery prototype

on:
  push:
    branches: [experiment/dm211-breadcrumbs-grp619]
    paths:
      - '.github/workflows/data-mind-2-11-breadcrumb-grp619.yml'
      - 'experiments/data_mind_2_11_tptp95_grp619.py'
      - 'experiments/data_mind_2_10_tptp95_grp619.py'
      - 'experiments/data_mind_2_7_tptp95_proof_density.py'
      - 'experiments/data_mind_2_6_tptp95_pilot.py'
      - 'src/data_atp/**'
      - 'tests/test_breadcrumbs.py'
  workflow_dispatch:
    inputs:
      target_seconds:
        description: 'Total E examination budget in seconds'
        required: false
        default: '300'
        type: string
      heartbeat_seconds:
        description: 'Breadcrumb heartbeat interval'
        required: false
        default: '10'
        type: string
      checkpoint_seconds:
        description: 'Pause/checkpoint barrier interval'
        required: false
        default: '30'
        type: string

permissions:
  contents: read
  actions: read

env:
  TPTP_VERSION: '9.3.1'
  TARGET: 'GRP619+1.p'
  TARGET_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_seconds || '300' }}
  HEARTBEAT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.heartbeat_seconds || '10' }}
  CHECKPOINT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint_seconds || '30' }}
  FROZEN_SNAPSHOT_COMMIT: '946ed4816dd0928f800165bef189df02f1560018'

jobs:
  dm211-grp619:
    name: dm211-grp619-checkpoint-barriers
    runs-on: ubuntu-24.04
    timeout-minutes: 430
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install E and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq eprover
          E_DEB=eprover_3.5.1+ds-1_amd64.deb
          E_URL="https://security.ubuntu.com/ubuntu/pool/universe/e/eprover/$E_DEB"
          curl -fL --retry 5 --retry-delay 3 --output "$E_DEB" "$E_URL"
          test -s "$E_DEB"
          sudo dpkg -i "$E_DEB"
          python -m pip install --disable-pip-version-check -q numpy
          python -m pip install --disable-pip-version-check -e .
          eprover --version | tee eprover-version.txt
          grep -q '3.5.1' eprover-version.txt

      - name: Run 2.11 breadcrumb/checkpoint unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_breadcrumbs tests.test_checkpoint tests.test_event_log_persistence -v
          python -m py_compile experiments/data_mind_2_11_tptp95_grp619.py

      - name: Restore and audit frozen 171/9 policy
        shell: bash
        run: |
          set -euo pipefail
          SNAP=training_snapshots/dm27_tptp95_proof_density_6h_001/metadata
          mkdir -p frozen_policy
          git show "$FROZEN_SNAPSHOT_COMMIT:$SNAP/tptp95_policy.json" > frozen_policy/tptp95_policy.json
          git show "$FROZEN_SNAPSHOT_COMMIT:$SNAP/split_manifest.json" > frozen_policy/split_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('frozen_policy/tptp95_policy.json').read_text())
          m=json.loads(Path('frozen_policy/split_manifest.json').read_text())
          assert p['target']==m['target']=='GRP619+1.p'
          assert m['training_count']==171 and m['holdout_count']==9
          assert m['target_in_training'] is False
          assert m['same_abstract_problem_variants_in_training'] is False
          assert not any(x.startswith('GRP619') for x in m['training_files'])
          print('FROZEN_SPLIT_AUDIT=VERIFIED')
          PY

      - name: Download official TPTP release
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="TPTP-v${TPTP_VERSION}.tgz"
          URL="https://tptp.org/TPTP/Distribution/${ARCHIVE}"
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 --output "$ARCHIVE" "$URL"
          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" "TPTP-v${TPTP_VERSION}/Problems/GRP" "TPTP-v${TPTP_VERSION}/Axioms"
          ROOT="$GITHUB_WORKSPACE/TPTP-v${TPTP_VERSION}"
          test -f "$ROOT/Problems/GRP/$TARGET"
          echo "TPTP_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: 2.11 monitored adapter smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/smoke
          python -u experiments/data_mind_2_11_tptp95_grp619.py smoke \
            --tptp-root "$TPTP_ROOT" \
            --policy frozen_policy/tptp95_policy.json \
            --manifest frozen_policy/split_manifest.json \
            --seconds 15 \
            --heartbeat-seconds 5 \
            --checkpoint-seconds 10 \
            --run-id "dm211-smoke-${GITHUB_RUN_ID}" \
            --out results/smoke \
            2>&1 | tee results/smoke/smoke.log

      - name: 2.11 verifier-gated held-out examination
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/examination
          python -u experiments/data_mind_2_11_tptp95_grp619.py examine \
            --tptp-root "$TPTP_ROOT" \
            --policy frozen_policy/tptp95_policy.json \
            --manifest frozen_policy/split_manifest.json \
            --smoke-result results/smoke/smoke_result.json \
            --total-seconds "$TARGET_SECONDS" \
            --heartbeat-seconds "$HEARTBEAT_SECONDS" \
            --checkpoint-seconds "$CHECKPOINT_SECONDS" \
            --run-id "dm211-examine-${GITHUB_RUN_ID}" \
            --out results/examination \
            2>&1 | tee results/examination/examination.log

      - name: Publish 2.11 diagnostic summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('# DATA-MIND 2.11 GRP619 checkpoint-barrier prototype')
          for label, path in [
              ('Smoke', Path('results/smoke/smoke_result.json')),
              ('Examination', Path('results/examination/result.json')),
          ]:
              print(f'\n## {label}')
              if not path.exists():
                  print('No result JSON was produced; this is infrastructure-level evidence.')
                  continue
              r=json.loads(path.read_text())
              print(f"- Status: **{r['status']}**")
              print(f"- Breadcrumb chain verified: `{r.get('breadcrumb_chain_verified')}`")
              for run in r.get('runs', []):
                  print(
                      f"- `{run.get('problem_form','?')}:{run.get('strategy')}`: "
                      f"class=`{run.get('outcome_class')}`, rc=`{run.get('returncode')}`, "
                      f"wall_timeout=`{run.get('wall_timed_out')}`, szs=`{run.get('szs_status')}`"
                  )
          PY

      - name: Upload complete 2.11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm211-breadcrumb-grp619-${{ github.run_id }}
          path: |
            results/
            frozen_policy/
            eprover-version.txt
          if-no-files-found: warn
          retention-days: 90
